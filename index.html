<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pizzaria online - UML em codigo</title>
</head>
<body>
    <header>
        <h1> pizzaria online</h1>
        <p> Modelo de dominio (UML) virando programa: monte um pedido e veja os objetos mudando em tempo real</p>
    </header>
    <main>
        <section>
            <h2>Cardápio</h2>
            <div id="menu"></div>
        </section>

        <section>
            <h2>pedido</h2>
            <label>Cliente<input id="nome" placeholder="nome"</label>
            <label>Endereço de entrega<input id="rua" placeholder="Rua e número"</label>
            <label>Cidade<input id="cidade" placeholder="cidade"</label>
            <h3>itens</h3>
            <div id="itens" class="mut">Nenhum, item ainda</div>
            <div class="tot"><span>Total</span><span id="total">0,00</span></div>
           <label>pagmento
            <select id="forma"><option>pix</option><option>cartão</option><option>dinheiro</option></select>
           </label>
           <button id="fin" style=""
        </section>
    </main>
</body>
</html>
